name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Repository tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/repository-quality.test.mjs
      - name: Build
        run: npm run build
